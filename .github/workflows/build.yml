name: build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-openwrt-toolchains:
    name: Build openwrt toolchains
    runs-on: ubuntu-latest
    container:
      image: alpine:3.22
    steps:
      - name: install build prerequisites
        run: |
          apk --quiet update
          apk --quiet add argp-standalone bash bzip2 coreutils diffutils file findutils \
            g++ gawk gcc gcc-gnat git grep gzip linux-headers make musl-fts-dev \
            musl-libintl musl-obstack-dev ncurses-dev patch perl python3 rsync tar \
            unzip wget
      - name: add unprivileged user
        run: adduser -g OpenWrt -s /bin/bash -D openwrt
      - name: check out openwrt-gnat-toolchain
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: clone openwrt
        run: su openwrt -c 'git clone --quiet --branch v25.12.6 --depth 1 https://github.com/openwrt/openwrt.git source'
        working-directory: /home/openwrt
      - name: update openwrt feeds
        run: su openwrt -c './scripts/feeds update -a'
        working-directory: /home/openwrt/source
      - name: install openwrt feeds
        run: su openwrt -c './scripts/feeds install -a'
        working-directory: /home/openwrt/source
      - name: apply patches
        run: |
          su openwrt -c 'cp "$GITHUB_WORKSPACE/995-gnat-musl-libc.patch" ./toolchain/gcc/patches-14.x
          cp "$GITHUB_WORKSPACE/openwrt-disable-linux-build.patch" .
          cp "$GITHUB_WORKSPACE/openwrt-enable-gnat-ada-compiler.patch" .
          patch --strip=1 --input=openwrt-disable-linux-build.patch
          patch --strip=1 --input=openwrt-enable-gnat-ada-compiler.patch
          rm openwrt-disable-linux-build.patch
          rm openwrt-enable-gnat-ada-compiler.patch'
        working-directory: /home/openwrt/source
      - name: configure ipq806x generic
        run: |
          su openwrt -c 'cp "$GITHUB_WORKSPACE/diffconfig-ipq806x-generic-xr500" .config
          make defconfig'
        working-directory: /home/openwrt/source
      - name: build ipq806x generic toolchain
        run: |
          su openwrt -c 'make toolchain/download
          make --jobs=3 toolchain/install'
        working-directory: /home/openwrt/source
      - name: create ipq806x generic toolchain archive
        id: toolchain-archive
        run: |
          su openwrt -c 'make target/install
          TOOLCHAIN_ARCHIVE=$(ls /home/openwrt/source/bin/targets/ipq806x/generic/openwrt-toolchain-*.tar.zst)
          echo "TOOLCHAIN_ARCHIVE=$TOOLCHAIN_ARCHIVE" >> "$GITHUB_OUTPUT"'
        working-directory: /home/openwrt/source
      - name: upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: ${{ steps.toolchain-archive.outputs.TOOLCHAIN_ARCHIVE }}
          overwrite: true
          archive: false

